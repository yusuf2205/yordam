# Deployment stack for the user's NAS (UGREEN DXP4800 Plus, /volume1/docker/yordam).
# This is separate from the repo-root docker-compose.yml, which is for local
# development (Postgres + Redis only, backend run via `npm run start:dev`).
# Here Postgres/Redis are private to this stack's network — only `backend`
# is published on the host, since the NAS already has other services bound
# to the default 5432/6379/3000/3001 ports.
#
# Usage on the NAS:
#   cd /volume1/docker/yordam
#   cp deploy/nas/.env.example .env   # fill in secrets
#   docker compose -f deploy/nas/docker-compose.yml --env-file .env up -d --build

services:
  postgres:
    image: postgres:16-alpine
    container_name: yordam-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: yordam
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: yordam
    volumes:
      - yordam-postgres-data:/var/lib/postgresql/data
    networks:
      - yordam-net

  redis:
    image: redis:7-alpine
    container_name: yordam-redis
    restart: unless-stopped
    volumes:
      - yordam-redis-data:/data
    networks:
      - yordam-net

  backend:
    build:
      context: ../../backend
    container_name: yordam-backend
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: 3000
      DB_HOST: postgres
      DB_PORT: 5432
      DB_USER: yordam
      DB_PASSWORD: ${DB_PASSWORD}
      DB_NAME: yordam
      JWT_SECRET: ${JWT_SECRET}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY}
      AI_MODEL: ${AI_MODEL:-claude-sonnet-5}
    ports:
      - "3005:3000"
    depends_on:
      - postgres
      - redis
    networks:
      - yordam-net

networks:
  yordam-net:

volumes:
  yordam-postgres-data:
  yordam-redis-data:

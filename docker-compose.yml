services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: yordam
      POSTGRES_PASSWORD: yordam
      POSTGRES_DB: yordam
    ports:
      - '5432:5432'
    volumes:
      - yordam_postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    ports:
      - '6379:6379'
    volumes:
      - yordam_redis_data:/data

volumes:
  yordam_postgres_data:
  yordam_redis_data:
